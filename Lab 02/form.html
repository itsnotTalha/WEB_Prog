<!DOCTYPE html>
<html lang="en">

<head>

    <table border="1">

        </tr>
        <tr>
            <td>Email:</td>

        <tr>

            <td>
                <input type="number" name="age" id="age" placeholder="Enter age" width="20">

        </tr>
        <tr>
            <td>Password:</td>
            <td>
                <input type="password" name="password" id="password" placeholder="Enter Password" width="20">
            </td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td>
                <a><input type="radio" name="g1" value="Male">Male</a>
                <a><input type="radio" name="g1" value="Male">Female</a>
            </td>
        </tr>
        <tr>
            <td>Fruits:</td>
            <td>
                <a><input type="checkbox" name="g2" value="Male">Mango</a>
                <a><input type="checkbox" name="g2" value="Male">Banana</a>
            </td>
        </tr>
        <tr>
            <td>Fav Color:</td>

        </tr>
        <tr>

        </tr>
        <tr>

            <td>

                    <option value="country3">Uganda</option>

            </td>

        <tr>
            <td colspan="2" style="text-align: center;">
