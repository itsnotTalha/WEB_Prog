<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form>
        <label>Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter name" width="20">
        <br>
        <label>Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter email" width="20">
        <br>
        <label>Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter Password" width="20">
        <br>
        <label>Gender:</label>
        <a><input type="radio" name="g1" value="Male">Male</a>
        <a><input type="radio" name="g2" value="Male">Female</a>
        <br>
        <label>Country:</label>
        <input type="search" name="country" id="country" placeholder="Search your country" width="20">
        <br>
        <label>Upload</label>
        <input type="file" name="file" id="file" placeholder="Upload the file">
        <br>
        <button>Submit</button>
    </form>
    <hr>
    <hr>
    <table border="1">
        <tr>
            <td>Name:</td>
            <td>
                <input type="text" name="name" id="name" placeholder="Enter name" width="40">
            </td>
        </tr>
        <tr>
            <td>Email:</td>
            <td>
                <input type="email" name="email" id="email" placeholder="Enter email" width="20">
            </td>
        </tr>
        <tr>
            <td>Password:</td>
            <td>
                <input type="password" name="password" id="password" placeholder="Enter Password" width="20">
            </td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td>
                <a><input type="radio" name="g1" value="Male">Male</a>
                <a><input type="radio" name="g1" value="Male">Female</a>
            </td>
        </tr>
        <tr>
            <td>Country:</td>
            <td>
                <select name="country" id="country">
                    <option value="country1">Bangladesh</option>
                    <option value="country2">Canada</option>
                    <option value="country3">Uganda</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Upload:</td>
            <td>
                <input type="file" name="file" id="file" placeholder="Upload the file">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button>Submit</button>
            </td>
        </tr>
    </table>
</body>

</html>
